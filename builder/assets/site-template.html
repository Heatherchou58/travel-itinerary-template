<!DOCTYPE html>
<html lang="zh-TW" data-theme="snow">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- 行程含住宿、日期與同行者，不要被搜尋引擎收錄。
     專案站（/{repo}/）無法用 robots.txt——爬蟲只讀網域根目錄的那一份。 -->
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#74B9FF">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅遊模板">
<title>旅遊行程模板</title>
<style>
/* ═══════════════════════════════════════════════
   設計層 —— 換旅程時不需要修改
   ═══════════════════════════════════════════════ */
:root{
  /* 色彩：單一語意化系統 */
  --c-bg:#F5F2ED;
  --c-surface:#FFFFFF;
  --c-text:#3B3733;
  --c-text-dim:#8A8178;
  --c-line:#E7E1D8;
  --c-accent:#74B9FF;
  --c-accent-soft:#E8F4FF;
  --c-on-accent:#0F4670;
  --deco-size:120px 120px,180px 180px,240px 240px;
  --c-warn:#E0A458;
  --c-warn-soft:#FDF4E7;
  --c-danger:#D9534F;
  --c-ok:#4CAF7D;
  /* 外部服務色（固定不隨主題變） */
  --c-naver:  #029343;
  --c-booking:#E05000;
  --c-map:    #1A73E8;
  --c-pop:    #B85C00;   /* theme 樣式用的對比色，各主題覆寫 */
  /* 尺寸 */
  --w-app:480px;
  --r-card:14px;
  --r-pill:20px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --fs-xs:.75rem; --fs-sm:.85rem; --fs-md:1rem; --fs-lg:1.15rem; --fs-xl:1.5rem;
  --shadow:0 2px 8px rgba(0,0,0,.06);
}

[data-theme="none"]  { --deco:none; --deco-op:0; --anim-a:none; --anim-b:none; }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Roboto,sans-serif;
  background:var(--c-bg); color:var(--c-text);
  font-size:var(--fs-md); line-height:1.6;
  display:flex; justify-content:center;
  overflow-x:hidden; -webkit-text-size-adjust:100%;
}

/* 主題裝飾：兩個獨立圖層，速度與路徑都不同，避免整片同步平移 */
body::before, body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
}
body::before{
  background-image:var(--deco-a,var(--deco)),var(--deco-b,var(--deco));
  background-size:var(--deco-size);
  background-repeat:var(--deco-repeat,repeat);
  background-position:var(--deco-pos,0 0);
  opacity:var(--deco-op);
  animation:var(--anim-a) 24s linear infinite;
}
body::after{
  background-image:var(--deco-c,var(--deco));
  background-size:var(--deco-size2,var(--deco-size));
  background-repeat:var(--deco-repeat,repeat);
  background-position:var(--deco-pos,0 0);
  opacity:calc(var(--deco-op) * .7);
  animation:var(--anim-b) 17s linear infinite;
}
/* 垂直位移 720px（120／180／240 的公倍數），才能無縫接回；
   水平回到原點，中間的節點刻意不等距，落下速度才不會像機器 */
@keyframes driftA{
  0%   { background-position:-26px -240px, 58px -240px; }
  35%  { background-position: 18px   14px, 10px   34px; }
  70%  { background-position:-22px  268px, 62px  288px; }
  100% { background-position:-26px  480px, 58px  480px; }
}
@keyframes driftB{
  0%   { background-position: 40px -300px; }
  40%  { background-position:-16px  -12px; }
  75%  { background-position: 34px  240px; }
  100% { background-position: 40px  420px; }
}
/* 氣泡由下往上，同樣位移 720px */
@keyframes riseA{
  0%   { background-position:-22px  480px, 62px  480px; }
  35%  { background-position: 16px  226px,  8px  206px; }
  70%  { background-position:-18px  -28px, 58px  -48px; }
  100% { background-position:-22px -240px, 62px -240px; }
}
@keyframes riseB{
  0%   { background-position: 36px  420px; }
  40%  { background-position:-12px  132px; }
  75%  { background-position: 30px -120px; }
  100% { background-position: 36px -300px; }
}
@media (prefers-reduced-motion:reduce){
  body::before, body::after{ animation:none; opacity:0; }
  .route-dot.on::after, .route-link .bar::after{ animation:none; opacity:0; }
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

.app{ width:100%; max-width:var(--w-app); position:relative; z-index:1; padding-bottom:var(--sp-6); }

/* ── Header ───────────────────────────── */
header{ text-align:center; padding:var(--sp-5) var(--sp-4) var(--sp-3); }
header h1{ font-size:var(--fs-xl); margin:0 0 var(--sp-1); letter-spacing:.5px; }
header .subtitle{ font-size:var(--fs-sm); color:var(--c-text-dim); margin:0 0 var(--sp-4); }

/* ── 目前天氣條 ───────────────────────── */
.wx-now{
  background:var(--c-surface); border-radius:var(--r-card); box-shadow:var(--shadow);
  padding:var(--sp-4); text-align:left;
}
.wx-top{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:var(--sp-2); margin-bottom:var(--sp-3);
}
.wx-date{ font-size:var(--fs-md); font-weight:800; color:var(--c-text); letter-spacing:.2px; }
.wx-date span{ font-size:var(--fs-xs); font-weight:400; color:var(--c-text-dim); margin-left:var(--sp-2); }
.wx-time{ font-size:var(--fs-sm); color:var(--c-text-dim); white-space:nowrap; }
.wx-main{ display:flex; align-items:center; gap:var(--sp-4); }
.wx-emoji{ font-size:2.6rem; line-height:1; flex:0 0 auto; }
.wx-temp{ font-size:2.4rem; font-weight:800; line-height:1; letter-spacing:-2px; }
.wx-desc{ font-size:var(--fs-sm); color:var(--c-text-dim); margin-top:3px; }
.wx-hl{ margin-left:auto; text-align:right; white-space:nowrap; }
.wx-hl .cap{ font-size:var(--fs-xs); color:var(--c-text-dim); }
.wx-hl .hi{ font-size:1.3rem; font-weight:800; line-height:1.15; }
.wx-hl .lo{ font-size:1.1rem; color:var(--c-text-dim); line-height:1.15; }
/* 數據列：標籤與數值同一行，高度只有原本的一半 */
.wx-grid{
  display:flex; margin-top:var(--sp-3); background:var(--c-accent-soft);
  border-radius:8px; padding:var(--sp-1) 0;
}
.wx-grid div{
  flex:1; text-align:center; font-size:var(--fs-xs); color:var(--c-text-dim);
  line-height:1.9; white-space:nowrap;
}
.wx-grid div + div{ border-left:1px solid rgba(0,0,0,.06); }
.wx-grid b{ font-size:var(--fs-sm); color:var(--c-text); margin-left:3px; font-weight:700; }
.wx-stamp{ font-size:var(--fs-xs); color:var(--c-text-dim); text-align:center; margin-top:var(--sp-1); }

/* ── 導覽膠囊 ─────────────────────────── */
.nav-bar{
  display:flex; gap:var(--sp-1); overflow-x:auto; padding:var(--sp-2) var(--sp-4);
  position:sticky; top:0; z-index:100;
  background:color-mix(in srgb,var(--c-bg) 92%,transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.nav-bar::-webkit-scrollbar{ display:none; }
.nav-item{
  flex:0 0 auto; display:inline-flex; flex-direction:column;
  align-items:center; justify-content:center; line-height:1.25;
  padding:var(--sp-2) var(--sp-4); min-height:44px;
  border:1px solid var(--c-line); border-radius:var(--r-pill);
  background:var(--c-surface); color:var(--c-text-dim);
  font-size:var(--fs-sm); font-family:inherit; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:background .15s,color .15s;
}
.nav-item[aria-selected="true"]{ background:var(--c-accent); border-color:var(--c-accent); color:var(--c-on-accent); }
.nav-item:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{
  outline:2px solid var(--c-accent); outline-offset:2px;
}

/* ── 內容 ─────────────────────────────── */
main{ padding:var(--sp-3) var(--sp-4) 0; }
.card.lodge{ background:var(--c-accent-soft); border:1px solid var(--c-accent); }
.ttag{
  display:inline-block; background:var(--c-accent); color:var(--c-on-accent);
  font-size:var(--fs-xs); font-weight:700; padding:2px var(--sp-2);
  border-radius:6px; margin-bottom:var(--sp-2); margin-right:var(--sp-2);
}
.info{ margin-top:var(--sp-3); padding-top:var(--sp-3); border-top:1px dashed var(--c-line); font-size:var(--fs-sm); }
.info div{ padding:2px 0; }
.card{
  background:var(--c-surface); border-radius:var(--r-card); box-shadow:var(--shadow);
  padding:var(--sp-4); margin-bottom:var(--sp-3);
}
/* ── 購物清單與優惠券 ─────────────────────
   兩欄網格，每格一張圖加三個欄位。手機上兩欄剛好，圖片縮圖點了放大。 */
.shop-g{ margin-top:var(--sp-3); border-top:1px solid var(--c-line); }
.shop-g summary{
  display:flex; align-items:center; gap:var(--sp-2);
  min-height:44px; cursor:pointer; list-style:none;
  font-size:var(--fs-sm); font-weight:700; color:var(--c-on-accent);
}
.shop-g summary::-webkit-details-marker{ display:none; }
.shop-g summary::before{ content:"▸"; display:inline-block; transition:transform .15s; }
.shop-g[open] summary::before{ transform:rotate(90deg); }
.shop-gn{ flex:1; }
.shop-n{ font-weight:400; color:var(--c-text-dim); }
.shop-gx{
  min-height:44px; padding:0 var(--sp-2); border:none; background:none;
  color:var(--c-text-dim); font-family:inherit; font-size:var(--fs-xs); cursor:pointer;
}
.shop-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); }
.shop-i{
  position:relative; display:flex; flex-direction:column; gap:var(--sp-2);
  border:1px solid var(--c-line); border-radius:10px; padding:var(--sp-2);
}
/* 沒有圖片的卡片，內容要讓開左上角那顆 ✕，否則會跟勾選框疊在一起 */
.shop-i.no-img{ padding-top:34px; }
.shop-x{
  position:absolute; top:2px; left:2px; z-index:1;
  width:28px; height:28px; border-radius:50%;
  border:1px solid var(--c-line); background:var(--c-surface);
  color:var(--c-text-dim); font-family:inherit; line-height:1; cursor:pointer;
}
.shop-img{
  width:100%; height:120px; object-fit:cover;
  border-radius:8px; background:var(--c-accent-soft); cursor:zoom-in;
}
.shop-who{ display:block; font-size:var(--fs-xs); font-weight:400; color:var(--c-text-dim); }
.shop-note, .shop-amt{ font-size:var(--fs-xs); padding:6px var(--sp-2); min-height:36px; }
.shop-link{ margin:0; width:100%; text-align:center; }
.shop-add, .shop-addg{ display:flex; gap:var(--sp-2); margin-top:var(--sp-2); }
.shop-add .input, .shop-addg .input{ flex:1; min-width:0; }
.shop-add .btn, .shop-addg .btn{ margin-top:0; flex:0 0 auto; }
.shop-addg{ margin-top:var(--sp-3); }

/* 放大檢視：給店員看的時候要夠大 */
#zoom{
  border:none; border-radius:14px; padding:0; max-width:96vw; max-height:92vh;
  background:var(--c-surface);
}
#zoom::backdrop{ background:rgba(0,0,0,.72); }
#zoom img{ display:block; max-width:96vw; max-height:80vh; object-fit:contain; }
.zoom-x{
  display:block; width:100%; min-height:44px; border:none;
  background:var(--c-accent); color:var(--c-on-accent);
  font-family:inherit; font-weight:700; cursor:pointer;
}

/* ── 信用卡回饋額度 ───────────────────────
   每張卡一塊，重點是「還能刷多少」而不是卡片清單本身。 */
.cc{
  border:1px solid var(--c-line); border-radius:10px;
  padding:var(--sp-3); margin-top:var(--sp-3);
}
.cc-head{ display:flex; align-items:flex-start; gap:var(--sp-2); }
.cc-name{ flex:1; font-weight:700; font-size:var(--fs-md); }
.cc-rate{
  margin-left:var(--sp-2); padding:1px var(--sp-2); border-radius:var(--r-pill);
  background:var(--c-accent-soft); color:var(--c-on-accent); font-size:var(--fs-xs);
}
.cc-x, .cc-restore{
  flex:0 0 auto; min-height:44px; padding:0 var(--sp-3);
  border:1px solid var(--c-line); border-radius:var(--r-pill);
  background:var(--c-surface); color:var(--c-text-dim);
  font-family:inherit; font-size:var(--fs-xs); cursor:pointer;
}
.cc-restore{ width:100%; margin-top:var(--sp-3); }
.cc-expired{ color:var(--c-danger); font-weight:700; }
.cc-field{ display:flex; align-items:center; gap:var(--sp-3); margin-top:var(--sp-3); }
.cc-field span{ flex:0 0 auto; font-size:var(--fs-sm); color:var(--c-text-dim); }
.cc-field .input{ flex:1; min-width:0; }
.cc-bar{
  height:6px; border-radius:3px; background:var(--c-line);
  margin-top:var(--sp-3); overflow:hidden;
}
.cc-bar i{ display:block; height:100%; background:var(--c-accent); transition:width .2s; }
.cc-used{ margin-top:var(--sp-2); }
.cc-left{ margin-top:2px; font-weight:700; color:var(--c-on-accent); }
.cc-left.cc-full{ color:var(--c-danger); }   /* 額度用完，再刷就沒加碼了 */
.cc-reg{ margin-top:var(--sp-2); }
/* ── 卡片上的私人資料 ─────────────────────────
   門鎖密碼與訂單編號：網站上只有密文，輸入通關密語才在這台裝置解開，
   解開後直接顯示在對應的卡片上。鎖著時只有一顆按鈕。 */
.secret{
  margin-top:var(--sp-3); padding:var(--sp-2) var(--sp-3);
  border:1px dashed var(--c-line); border-radius:10px;
}
.secret.is-locked{ padding:0; border:none; }
.secret-ask{
  width:100%; min-height:44px; padding:0 var(--sp-3); text-align:left;
  border:1px dashed var(--c-line); border-radius:10px;
  background:var(--c-surface); color:var(--c-text-dim);
  font-family:inherit; font-size:var(--fs-sm); cursor:pointer;
}
/* 標籤在上、值在下：值多半是長串編號，靠右擺在窄螢幕會被拆成好幾段 */
.secret-row{ padding:var(--sp-1) 0; }
.secret-label{ display:block; font-size:var(--fs-xs); color:var(--c-text-dim); }
.secret-val{ display:block; font-size:var(--fs-md); font-weight:700; word-break:break-all; user-select:all;
             font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.secret-note{ margin:var(--sp-2) 0; font-size:var(--fs-sm); color:var(--c-text-dim); }
.secret-lock{
  display:block; min-height:44px; padding:0; margin-top:var(--sp-1);
  border:none; background:none; color:var(--c-text-dim);
  font-family:inherit; font-size:var(--fs-xs); text-decoration:underline; cursor:pointer;
}
.vault-form{ display:flex; flex-wrap:wrap; align-items:center; gap:0 var(--sp-2); }
.vault-form .input{ flex:1 1 10em; width:auto; min-width:0; }
.vault-form .btn{ margin:0; }
.vault-remember{ display:flex; align-items:center; gap:var(--sp-2); flex:1 0 100%;
                 min-height:44px; font-size:var(--fs-sm); color:var(--c-text-dim); }
.vault-remember input{ width:18px; height:18px; accent-color:var(--c-accent); flex:0 0 auto; }
.vault-msg{ flex:1 0 100%; min-height:1.4em; font-size:var(--fs-sm); color:var(--c-text-dim); }
.vault-msg.is-err{ color:var(--c-danger); font-weight:700; }
/* 有備註的清單項目：勾選框對齊第一行，備註不要被刪除線劃到 */
.chk.has-note{ align-items:flex-start; padding:var(--sp-2) 0; }
.chk-note{ display:block; margin-top:2px; font-size:var(--fs-xs);
           font-weight:400; color:var(--c-text-dim); }
.chk input:checked + span .chk-note{ text-decoration:none; }

/* ── 現在進行到哪 ─────────────────────────
   目前項目用主題色標出來，已結束的降低存在感，讓視線自動落到「現在」。
   邊框用 transparent 佔位，套用時才不會整張卡片位移。 */
.card{ border-left:4px solid transparent; }
/* 用 shorthand 連寬度一起指定。住宿卡片的 .card.lodge 有自己的 1px 邊框，
   只改 border-left-color 的話，住宿變成「現在」時高亮只有 1px。 */
.card.is-now{ border-left:4px solid var(--c-accent); background:var(--c-accent-soft); }
.card.is-next{ border-left:4px solid var(--c-line); }
.card.is-past{ opacity:.62; }
/* 這行不能省：瀏覽器的 [hidden]{display:none} 來自 UA 樣式表，
   會被下面的 display:inline-flex 蓋掉，收起來的膠囊仍會露出一小條色塊。 */
.now-line[hidden]{ display:none; }
.now-line{
  display:inline-flex; align-items:center; margin-bottom:var(--sp-2);
  padding:3px var(--sp-3); border-radius:var(--r-pill);
  background:var(--c-accent); color:var(--c-on-accent);
  font-size:var(--fs-xs); font-weight:700;
}
.card.is-next .now-line{ background:var(--c-line); color:var(--c-text); }
/* 「今天」接在日期那一行後面。掛在 .nav-item 上的話，
   按鈕變成直向排列後它會自己佔掉第三行。 */
.nav-sub{ font-size:var(--fs-xs); font-weight:400; opacity:.75; }
.nav-item.is-today .nav-sub::after{ content:"・今天"; }

.time{
  display:inline-block; background:var(--c-accent-soft); color:var(--c-text);
  font-size:var(--fs-xs); font-weight:700; padding:2px var(--sp-2);
  border-radius:6px; margin-bottom:var(--sp-2);
}
.stay{
  display:inline-block; font-size:var(--fs-xs); color:var(--c-text-dim);
  margin-left:var(--sp-2); margin-bottom:var(--sp-2);
}
.subject{ font-size:var(--fs-lg); font-weight:700; margin-bottom:var(--sp-1); }
.lang-local{ font-size:var(--fs-sm); color:var(--c-text-dim); font-weight:400; margin-left:var(--sp-1); }
.meta{ font-size:var(--fs-sm); color:var(--c-text-dim); margin-bottom:var(--sp-1); }
.note-box{
  background:var(--c-accent-soft); border-radius:10px;
  padding:var(--sp-3); margin-top:var(--sp-3); font-size:var(--fs-sm); line-height:1.7;
}
.note-box.warn{ background:var(--c-warn-soft); border-left:3px solid var(--c-warn); }

/* ── 景點介紹（預設收合）─────────────────
   旅途中主要看的是時間與交通，介紹是背景知識，收起來才不會把
   一天的版面拉得太長。展開/收合由原生 <details> 處理，沒有 JS。 */
.intro{ margin-top:var(--sp-3); border-top:1px solid var(--c-line); }
.intro summary{
  display:flex; align-items:center; gap:var(--sp-2);
  min-height:44px; cursor:pointer; list-style:none;
  font-size:var(--fs-sm); font-weight:700; color:var(--c-on-accent);
}
.intro summary::-webkit-details-marker{ display:none; }   /* Safari 的預設三角 */
.intro summary::before{ content:"▸"; display:inline-block; transition:transform .15s; }
.intro[open] summary::before{ transform:rotate(90deg); }
.intro-body{ padding-bottom:var(--sp-2); font-size:var(--fs-sm); line-height:1.8; }
.intro-body p{ margin:0 0 var(--sp-3); }
.intro-body p:last-child{ margin-bottom:0; }

/* ── 按鈕 ─────────────────────────────── */
.btn{
  display:inline-block; margin-top:var(--sp-2); margin-right:var(--sp-2);
  padding:10px var(--sp-4); min-height:44px; line-height:24px;
  border:none; border-radius:10px; text-decoration:none;
  font-size:var(--fs-sm); font-weight:700; font-family:inherit;
  color:#FFFFFF; background:var(--c-text); cursor:pointer;
}
.btn-naver{ background:var(--c-naver); }
.btn-booking{ background:var(--c-booking); }
.btn-map  { background:var(--c-map); }
/* theme：主題色的互補色，在一排服務色按鈕裡跳出來 */
.btn-theme{ background:var(--c-pop); color:#FFFFFF; }
/* 路線：外框樣式，跟「開啟某個服務」的實心按鈕區隔開 */
.btn-route{
  background:transparent; color:var(--c-on-accent);
  border:1.5px solid var(--c-accent); font-weight:700;
}
.btn:active{ opacity:.85; }

/* ── 航班卡 ───────────────────────────── */
.flight{ border:1px solid var(--c-accent); }
.fl-head{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:var(--fs-xs); color:var(--c-text-dim); margin-bottom:var(--sp-3);
}
.fl-air{ font-weight:700; color:var(--c-text); letter-spacing:.3px; }
.fl-air b{ color:var(--c-on-accent); margin-left:var(--sp-2); font-weight:800; }
.fl-body{ display:grid; grid-template-columns:auto minmax(48px,1fr) auto; align-items:center; gap:var(--sp-3); }
.fl-side .t{ font-size:1.4rem; font-weight:800; line-height:1.05; letter-spacing:-.5px; }
.fl-side .p{ font-size:var(--fs-sm); font-weight:700; letter-spacing:1.5px; color:var(--c-on-accent); }
.fl-side .g{ font-size:var(--fs-xs); color:var(--c-text-dim); white-space:nowrap; }
.fl-side.end{ text-align:right; }
.fl-mid{ position:relative; display:flex; align-items:center; justify-content:center; }
.fl-mid::before{
  content:""; position:absolute; left:0; right:0; top:50%;
  border-top:1px dashed var(--c-line);
}
.fl-mid span{
  position:relative; background:var(--c-surface); padding:0 var(--sp-2);
  font-size:.9rem; color:var(--c-accent);
}

/* ── 交通路線 ─────────────────────────── */
.route{ margin-top:var(--sp-3); padding-left:2px; }
.route-step{ display:flex; gap:var(--sp-3); align-items:flex-start; }
.route-dot{
  position:relative; flex:0 0 14px; width:14px; height:14px; margin-top:5px;
  border-radius:50%; background:var(--c-line); border:2px solid var(--c-surface);
  box-sizing:content-box; z-index:2;
}
/* 起終點：脈動光暈 */
.route-dot.on{ background:var(--c-accent); }
.route-dot.on::after{
  content:""; position:absolute; inset:0; border-radius:50%;
  background:var(--c-accent); animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{
  0%   { transform:scale(1);   opacity:.45; }
  70%  { transform:scale(2.6); opacity:0; }
  100% { transform:scale(1);   opacity:0; }
}
.route-body{ flex:1; padding-bottom:var(--sp-2); }
.route-body strong{ font-size:var(--fs-md); }
/* 連接線：光點由上往下流 */
.route-link{ display:flex; gap:var(--sp-3); }
.route-link .bar{ flex:0 0 18px; display:flex; justify-content:center; }
.route-link .bar::before{
  content:""; width:4px; min-height:34px; border-radius:2px;
  background:var(--c-line); position:relative; overflow:hidden;
}
.route-link .bar{ position:relative; }
.route-link .bar::after{
  content:""; position:absolute; left:calc(50% - 2px); width:4px; height:16px;
  border-radius:2px; background:var(--c-accent);
  animation:flow 1.8s linear infinite;
}
@keyframes flow{
  from{ top:-16px; opacity:0; }
  15% { opacity:.85; }
  85% { opacity:.85; }
  to  { top:100%;   opacity:0; }
}
.route-link .via{ flex:1; font-size:var(--fs-xs); color:var(--c-text-dim); padding:var(--sp-2) 0; }
.exit-note{ font-size:var(--fs-sm); color:var(--c-text-dim); }

/* ── 選項（多選一） ───────────────────── */
.choice{ border:1px solid var(--c-line); border-radius:10px; padding:var(--sp-3); margin-top:var(--sp-2); }
.choice .tag{
  display:inline-block; background:var(--c-accent); color:var(--c-on-accent); font-size:var(--fs-xs);
  font-weight:700; padding:1px var(--sp-2); border-radius:5px; margin-bottom:var(--sp-1);
}

/* ── 勾選清單 ─────────────────────────── */
.chk-group{ margin-top:var(--sp-3); }
.chk-group:first-of-type{ margin-top:var(--sp-2); }
.chk-group h4{ margin:0 0 var(--sp-2); font-size:var(--fs-sm); color:var(--c-on-accent); }
.chk{
  display:flex; align-items:center; gap:10px;
  min-height:44px; padding:0; cursor:pointer; font-size:var(--fs-sm); line-height:1.4;
}
.chk input{ width:18px; height:18px; accent-color:var(--c-accent); flex:0 0 auto; }
.chk input:checked + span{ color:var(--c-text-dim); text-decoration:line-through; }
.chk-progress{ font-size:var(--fs-xs); color:var(--c-text-dim); }
/* 帶連結的清單項目：連結是 label 外的獨立元素，點它不會順便打勾 */
.chk-row{ display:flex; align-items:center; gap:var(--sp-2); }
.chk-row .chk{ flex:1; min-width:0; }
.chk-link{
  flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; min-width:44px; padding:0 var(--sp-2);
  color:var(--c-on-accent); font-size:var(--fs-sm); font-weight:700;
  text-decoration:none; white-space:nowrap;
}
.chk-link:hover{ text-decoration:underline; }

/* ── 天氣預報列 ───────────────────────── */
.wx-strip{ display:flex; gap:var(--sp-2); overflow-x:auto; padding-bottom:var(--sp-2); scrollbar-width:none; }
.wx-strip::-webkit-scrollbar{ display:none; }
.wx-day{
  flex:0 0 76px; text-align:center; background:var(--c-accent-soft);
  border-radius:10px; padding:var(--sp-2) var(--sp-1); font-size:var(--fs-xs);
}
.wx-day .e{ font-size:1.4rem; line-height:1.3; }
.wx-day .hi{ font-weight:800; }
.wx-day .lo{ color:var(--c-text-dim); }

/* ── 記帳 ─────────────────────────────── */
.field{ margin-bottom:var(--sp-3); }
.field > label{ display:block; font-size:var(--fs-sm); font-weight:700; margin-bottom:var(--sp-2); }
.input{
  width:100%; padding:10px var(--sp-3); min-height:44px;
  border:1px solid var(--c-line); border-radius:10px;
  background:var(--c-surface); color:var(--c-text);
  font-size:var(--fs-md); font-family:inherit;
}
.chips{ display:flex; flex-wrap:wrap; gap:var(--sp-2); }
.chip{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; min-width:44px; padding:var(--sp-1) var(--sp-3);
  border:1px solid var(--c-line); border-radius:var(--r-pill);
  background:var(--c-surface); font-size:var(--fs-sm); cursor:pointer; user-select:none;
}
.chip input{ position:absolute; opacity:0; width:0; height:0; }
.chip:has(input:checked){ background:var(--c-accent); border-color:var(--c-accent); color:var(--c-on-accent); font-weight:700; }
.row2{ display:flex; gap:var(--sp-2); }
.row2 > *{ flex:1; }
.exp-list{ margin-top:var(--sp-2); }
.exp-item{
  display:flex; justify-content:space-between; align-items:flex-start; gap:var(--sp-2);
  padding:var(--sp-2) 0; border-bottom:1px solid var(--c-line); font-size:var(--fs-sm);
}
.exp-item:last-child{ border-bottom:none; }
.exp-item .amt{ font-weight:700; white-space:nowrap; text-align:right; }
.exp-del{
  border:none; background:none; color:var(--c-danger); cursor:pointer;
  font-size:var(--fs-sm); padding:0 var(--sp-1);
  min-height:44px; min-width:44px;   /* ✕ 本身只有約 20px 寬，不補寬度就點不到 */
}
.settle{ display:flex; justify-content:space-between; padding:var(--sp-2) 0; font-size:var(--fs-sm); }
.settle b{ color:var(--c-on-accent); }

/* ── 同步狀態 ─────────────────────────── */
/* 連線狀態固定在左下角。原本在右上角，但它是 position:fixed、z-index 比
   置頂的導覽列高，會直接蓋住分頁按鈕——導覽列加上日期那一行之後更明顯。
   左下角不擋任何可點擊的東西，也還是一眼看得到。 */
.sync{
  position:fixed; left:var(--sp-2); z-index:200;
  bottom:calc(var(--sp-2) + env(safe-area-inset-bottom));
  font-size:var(--fs-xs); font-weight:700; padding:var(--sp-1) var(--sp-3);
  border-radius:var(--r-pill); background:var(--c-surface); box-shadow:var(--shadow);
}
.sync[data-s="ok"]{ color:var(--c-ok); }
.sync[data-s="offline"]{ color:var(--c-warn); }
.sync[data-s="local"]{ color:var(--c-text-dim); }
.sync[data-s="error"]{ color:var(--c-danger); }

/* ── 其他 ─────────────────────────────── */
.src{
  font-size:var(--fs-xs); color:var(--c-text-dim); line-height:1.6;
  background:var(--c-accent-soft); border-radius:8px;
  padding:var(--sp-2) var(--sp-3); margin-bottom:var(--sp-3);
}
.ph{ padding:var(--sp-2) 0; border-bottom:1px solid var(--c-line); }
.ph:last-child{ border-bottom:none; }
.ph-l{ font-size:var(--fs-md); line-height:1.5; }
.ph-l.dim{ color:var(--c-text-dim); }
.ph-z{ font-size:var(--fs-sm); color:var(--c-text-dim); margin-top:1px; }
.phrase{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:var(--sp-3); padding:var(--sp-2) 0; border-bottom:1px solid var(--c-line);
}
.phrase > span:first-child{ min-width:0; }              /* 讓標題可以折行 */
.phrase > span:last-child{
  flex:0 0 auto; white-space:nowrap; text-align:right;  /* 電話號碼絕不折行 */
  font-variant-numeric:tabular-nums;
}
.phrase:last-child{ border-bottom:none; }
.phrase .zh{ color:var(--c-text-dim); font-size:var(--fs-sm); }
.err{ background:var(--c-warn-soft); border-left:3px solid var(--c-danger); padding:var(--sp-3); border-radius:8px; font-size:var(--fs-sm); }
/* ── PWA：瀏海與底部安全區 ─────────────── */
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
/* 連線狀態已改到左下角，安全區在它自己的規則裡用 safe-area-inset-bottom
   處理。這裡若留著 top，fixed 元素同時有 top 與 bottom 會被撐滿整個視窗高。 */
.nav-bar{ top:env(safe-area-inset-top); }
.toast{
  /* 抬高一點，才不會壓到左下角的連線狀態 */
  position:fixed; left:50%; bottom:calc(var(--sp-6) + env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:300; max-width:calc(var(--w-app) - var(--sp-6));
  background:var(--c-text); color:var(--c-bg); font-size:var(--fs-sm); font-weight:600;
  padding:var(--sp-3) var(--sp-4); border-radius:var(--r-pill); box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.toast.show{ opacity:.96; }
/* ── 自適應：手機放大、平板加寬、桌機雙欄 ───────── */
/* 基準字級跟著螢幕微調：iPhone SE 16px → 17 Pro 16.9px → 17 Pro Max 18px */
html{ font-size:clamp(16px, 4.2vw, 18px); }

/* 平板：單欄但加寬 */
@media (min-width:600px){
  :root{ --w-app:600px; }
  body{ padding:var(--sp-4) var(--sp-4) 0; }
  main{ padding-left:0; padding-right:0; }
  header{ padding-left:0; padding-right:0; }
  .nav-bar{ padding-left:0; padding-right:0; }
}

/* 桌機：左欄放天氣與導覽（吸頂），右欄放行程 */
@media (min-width:1024px){
  html{ font-size:17px; }
  body{ align-items:flex-start; padding:var(--sp-5) var(--sp-5) 0; }
  .app{
    max-width:960px;
    display:grid;
    grid-template-columns:300px minmax(0,1fr);
    grid-template-rows:auto 1fr auto;
    column-gap:var(--sp-6);
  }
  header{ grid-column:1; grid-row:1; text-align:left; padding:0 0 var(--sp-4); }
  header h1{ font-size:1.35rem; }
  .nav-bar{
    grid-column:1; grid-row:2; align-self:start;
    position:sticky; top:var(--sp-4);
    flex-direction:column; overflow:visible;
    padding:0; background:none; backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .nav-item{ width:100%; text-align:left; }
  main{ grid-column:2; grid-row:1 / span 2; padding:0; }
  footer{ grid-column:1 / -1; grid-row:3; }
  /* 行程卡片較寬，內距跟著加大 */
  main .card{ padding:var(--sp-5); }
  main .card + .card{ margin-top:var(--sp-4); }
}

/* 超寬螢幕：只把內容欄加寬，不要拆成兩欄。
   行程是有時間順序的，拆欄之後閱讀動線會從第一欄底部跳到第二欄頂端，很難跟。 */
@media (min-width:1440px){
  .app{ max-width:1100px; grid-template-columns:300px minmax(0,720px); }
}

#edit-bar{ display:flex; gap:var(--sp-2); justify-content:center; flex-wrap:wrap; margin-bottom:var(--sp-4); }
#edit-bar a{
  display:inline-block; padding:10px var(--sp-4); min-height:44px; line-height:22px;
  border:1px solid var(--c-line); border-radius:var(--r-pill); background:var(--c-surface);
  color:var(--c-text); font-size:var(--fs-sm); font-weight:700; text-decoration:none;
}
#edit-bar a.go{ background:var(--c-accent); border-color:var(--c-accent); color:var(--c-on-accent); }
footer{ text-align:center; font-size:var(--fs-xs); color:var(--c-text-dim); padding:var(--sp-5) var(--sp-4); }
footer a{ color:inherit; }
</style>
</head>
<body>

<div class="sync" id="sync" data-s="local">單機模式</div>
<div class="app">
  <header>
    <h1 id="app-title">—</h1>
    <p class="subtitle" id="app-sub"></p>
    <div class="wx-now" id="wx-now"><div class="col">載入中…</div></div>
    <div class="wx-stamp" id="wx-stamp"></div>
  </header>
  <nav class="nav-bar" id="nav" role="tablist"></nav>
  <main id="main"></main>
  <footer>
    <div id="edit-bar"></div>
    天氣資料 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · CC BY 4.0
  </footer>
</div>

<script type="module">
/* ═══════════════════════════════════════════════
   資料層 —— 換旅程時「只改這一段」
   ═══════════════════════════════════════════════ */
const TRIP_DATA = {
  meta: {
    tripId: "demo-trip",
    title: "旅遊行程模板",
    subtitle: "把這段資料換掉就是一趟新旅行",
    theme: "snow",
    startDate: "2026-02-25",
    endDate:   "2026-03-03",
    place: { name:"Seoul", nameLocal:"서울", lat:37.5665, lon:126.9780, timezone:"Asia/Seoul" },
    money: { home:"TWD", local:"KRW", rate:0.024, rateDate:null },
    members: ["A", "B"],
    categories: ["食","衣","住","行","玩"],
    /* 由產生器填入：試算表網址與產生器網址，供「編輯行程」用 */
    sheetUrl: "",
    builderUrl: ""
  },

  days: [
    {
      id:"d0", nav:"📝 行前",
      blocks:[
        { type:"weather" },
        { type:"checklist", key:"prep", title:"出發前準備", groups:[
          { name:"證件", items:["護照","簽證／入境卡","保險"] },
          { name:"電子", items:["行動電源","轉接頭","eSIM"] }
        ]}
      ]
    },
    {
      id:"d1", nav:"D1 範例", date:"2026-02-25",
      blocks:[
        { type:"flight", airline:"EVA AIR", code:"BR160",
          from:"TPE", fromTerminal:"桃園T2", to:"ICN", toTerminal:"仁川T1",
          date:"2026-02-25", depart:"15:15", arrive:"18:45" },

        { type:"stop", kind:"sight", time:"18:45", title:"抵達機場", titleLocal:"인천국제공항",
          place:"仁川機場第一航廈",
          notes:["跟著 Airport Railroad 指標走"],
          links:[{ label:"🎟️ 訂票", url:"https://example.com", style:"klook" }] },

        { type:"transit", time:"20:13", title:"機場 ➔ 市區", line:"AREX 直達車", duration:"43 分鐘",
          steps:[
            { name:"仁川機場T1", nameLocal:"인천공항1터미널", active:true },
            { name:"孔德站", nameLocal:"공덕역", active:false },
            { name:"首爾站", nameLocal:"서울역", active:true, exit:"1 號出口（有電梯）" }
          ]},

        { type:"lodging", time:"21:00", title:"民宿 Check-in", address:"明洞 102호",
          notes:["門鎖密碼 5611*","WiFi hellopree","密碼 pree242424"],
          links:[{ label:"👉 地圖", url:"https://example.com", style:"naver" }] },

        { type:"stop", kind:"meal", time:"21:30", title:"宵夜：牡蠣菜包肉", titleLocal:"장군굴보쌈",
          place:"乙支路 3 街" },

        { type:"options", time:"22:30", title:"回程二選一", place:"乙支路 3 街",
          choices:[
            { label:"A", title:"走路 15 分鐘" },
            { label:"B", title:"計程車 ₩5,300" }
          ]}
      ]
    },
    { id:"wallet", nav:"💰 記帳", blocks:[ { type:"expenses" } ] },
    { id:"info", nav:"ℹ️ 資訊", blocks:[ { type:"phrases" },
      { type:"emergency", country:"South Korea", countryCode:"KR", auto:3 } ] }
  ],

  phrases: [
    { local:"얼마예요?", zh:"多少錢？" },
    { local:"화장실 어디예요?", zh:"廁所在哪裡？" }
  ],
  emergency: [
    { label:"報警", value:"112", tel:true },
    { label:"救護車", value:"119", tel:true }
  ]
};

/* Firebase：填入設定即啟用多人同步；留 null 則為單機模式 */
const FIREBASE_CONFIG = null;
/* 範例：
const FIREBASE_CONFIG = {
  apiKey:"...", authDomain:"xxx.firebaseapp.com",
  projectId:"xxx", storageBucket:"xxx.appspot.com",
  messagingSenderId:"...", appId:"..."
};
*/

/* ═══════════════════════════════════════════════
   邏輯層 —— 以下皆不需修改
   ═══════════════════════════════════════════════ */
const M = TRIP_DATA.meta;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ── 安全的本地儲存（沙箱環境不支援時退回記憶體） ── */
const memStore = new Map();
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return memStore.get(k) ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{ memStore.set(k,v); } },
  del(k){ try{ localStorage.removeItem(k); }catch{ memStore.delete(k); } }
};
const KEY = `trip:${M.tripId}`;

/* ── 狀態 ── */
const load = () => { try{ return JSON.parse(LS.get(KEY)) || {}; }catch{ return {}; } };
const saved = load();
const state = {
  checks: saved.checks || {},       // 個人清單（打包、個人購物）：只存本機
  shopping: saved.shopping || {},   // 共用清單：會同步給同行者
  cards: saved.cards || {},         // 信用卡額度追蹤：每人刷多少是自己的事，只存本機
  expenses: saved.expenses || [],
  queue: saved.queue || [],
  me: LS.get(`${KEY}:me`) || null
};
const persist = () => LS.set(KEY, JSON.stringify({
  checks: state.checks, shopping: state.shopping, cards: state.cards,
  expenses: state.expenses, queue: state.queue
}));

/* ── 同步狀態顯示 ── */
const syncEl = document.getElementById("sync");
function setSync(s, text){ syncEl.dataset.s = s; syncEl.textContent = text; }

/* ── 渲染分派 ── */
const linksHTML = (links=[]) => links.map(l =>
  `<a class="btn btn-${esc(l.style||"plain")}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
).join("");
const localSpan = t => t ? `<span class="lang-local">${esc(t)}</span>` : "";
const notesHTML = n => (n && n.length)
  ? `<div class="note-box">${n.map(x=>esc(x)).join("<br>")}</div>` : "";

/* ── 清單項目與勾選狀態 ──────────────────────
   項目可以是字串，也可以是 { text, url, note, img }。 */
const itemText = it => typeof it === "string" ? it : String(it?.text ?? "");

/* 勾選的 key 用「項目文字」而不是陣列索引。購物清單會頻繁增刪，
   用索引的話在中間插一項，後面所有打勾就整排錯位。 */
const chkKey = (b, g, it) => `${b.key}:${g.name}:${itemText(it)}`;

/* ── 購物清單 ────────────────────────────────
   Excel 給的是「種子」，使用者在網站上的增刪改存在 state.shopping。
   種子用「群組:名稱」當 id，所以之後用 builder 重新產生網站，
   Excel 新增的項目會出現、她在網站上加的不會消失、刪掉的也不會跑回來。 */
const shopBag = () => {
  const s = state.shopping;
  if (!s.edits)   s.edits   = {};
  if (!s.removed) s.removed = [];
  if (!s.added)   s.added   = [];
  if (!s.groups)  s.groups  = [];
  return s;
};

/* 把種子與本機資料合併成要渲染的群組。Map 保留插入順序：
   先種子群組、再使用者自己加的。 */
function shopGroups(b){
  const s = shopBag();
  const out = new Map();
  for (const g of (b.groups || [])){
    out.set(g.name, (g.items || []).map(it => {
      const o = (it && typeof it === "object") ? it : {};
      const name = String(o.name ?? o.text ?? it ?? "");
      return { id: `${g.name}:${name}`, group: g.name, name,
               img: o.img || "", url: o.url || "", who: o.who || "", seed: true };
    }));
  }
  for (const name of s.groups) if (!out.has(name)) out.set(name, []);
  for (const a of s.added){
    if (!out.has(a.group)) out.set(a.group, []);
    out.get(a.group).push({ ...a, seed: false });
  }
  for (const [k, arr] of out) out.set(k, arr.filter(x => !s.removed.includes(x.id)));
  return out;
}

/* ── 「現在進行到哪」用的時間換算 ──────────────
   卡片上掛 data-start / data-stay，實際的結束時間由 markNow() 依前後
   相鄰項目推算：沒填停留時間的項目（例如當天最後的住宿）若直接用
   start 當結束，會在抵達的那一秒就被判定成「已結束」。 */
const toMin  = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t ?? "")); return m ? +m[1] * 60 + +m[2] : null; };
const toHHMM = n => `${String(Math.floor(n / 60) % 24).padStart(2,"0")}:${String(n % 60).padStart(2,"0")}`;
const fmtMin = n => n >= 60 ? `${Math.floor(n / 60)} 小時${n % 60 ? ` ${n % 60} 分` : ""}` : `${n} 分`;
/* 沒有時間的項目不參與判斷 */
const slotAttrs = b => toMin(b.time) === null ? ""
  : ` data-start="${toMin(b.time)}" data-stay="${Number(b.stay) || 0}"`;
const nowSlot   = b => toMin(b.time) === null ? "" : `<div class="now-line" hidden></div>`;

/* 景點介紹：預設收合。用原生 <details> 而不是自己寫 JS——免事件綁定、
   鍵盤可操作、離線沒問題，重新渲染也不會壞。
   接受字串（以空行或換行分段）或字串陣列，Excel 給的是前者。 */
const introHTML = v => {
  const parts = (Array.isArray(v) ? v : String(v ?? "").split(/\n+/))
    .map(x => String(x ?? "").trim()).filter(Boolean);
  if (!parts.length) return "";
  return `<details class="intro"><summary>看介紹</summary>
    <div class="intro-body">${parts.map(p => `<p>${esc(p)}</p>`).join("")}</div>
  </details>`;
};

const WEEK = ["日","一","二","三","四","五","六"];
const niceDate = d => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || ""));
  if (!m) return d || "";
  const dt = new Date(`${d}T00:00:00Z`);
  return `${Number(m[2])}/${Number(m[3])}（${WEEK[dt.getUTCDay()]}）`;
};

const KIND = { sight:"🧭", meal:"🍽️", shop:"🛍️" };
const fmtStay = n => {
  if (!n) return "";
  if (n < 60) return `${n} 分`;
  const hh = Math.floor(n / 60), r = n % 60;
  return r ? `${hh} 小時 ${r} 分` : `${hh} 小時`;
};
const stayTag = b => b.stay ? `<span class="stay">⏳ 停留 ${fmtStay(b.stay)}</span>` : "";

const RENDERERS = {
  flight: b => `<div class="card flight">
    <div class="fl-head">
      <span class="fl-air">${esc(b.airline)} <b>${esc(b.code)}</b></span>
      <span>${esc(niceDate(b.date))}</span>
    </div>
    <div class="fl-body">
      <div class="fl-side">
        <div class="t">${esc(b.depart)}</div>
        <div class="p">${esc(b.from)}</div>
        <div class="g">${esc(b.fromTerminal || "")}</div>
      </div>
      <div class="fl-mid"><span>✈</span></div>
      <div class="fl-side end">
        <div class="t">${esc(b.arrive)}</div>
        <div class="p">${esc(b.to)}</div>
        <div class="g">${esc(b.toTerminal || "")}</div>
      </div>
    </div></div>`,

  stop: b => `<div class="card"${slotAttrs(b)}>
    ${nowSlot(b)}${b.time ? `<span class="time">${esc(b.time)}</span>` : ""}${stayTag(b)}
    <div class="subject">${KIND[b.kind] || KIND.sight} ${esc(b.title)}${localSpan(b.titleLocal)}</div>
    ${b.place ? `<div class="meta">📍 ${esc(b.place)}${localSpan(b.placeLocal)}</div>` : ""}
    ${notesHTML(b.notes)}${secretHTML(b)}${introHTML(b.intro)}${linksHTML(b.links)}</div>`,

  transit: b => `<div class="card">
    ${b.time ? `<span class="time">${esc(b.time)}</span>` : ""}
    <div class="subject">${esc(b.title)}</div>
    ${b.line ? `<div class="meta">🚇 ${esc(b.line)}</div>` : ""}
    ${b.duration ? `<div class="meta">⏱️ ${esc(b.duration)}</div>` : ""}
    <div class="route">${(b.steps||[]).map((s, i, all) => {
      const dot = s.via ? "" : `<div class="route-step">
           <div class="route-dot${s.active ? " on" : ""}"></div>
           <div class="route-body">
             <strong>${esc(s.name)}</strong>${localSpan(s.nameLocal)}
             ${s.exit ? `<div class="exit-note">${esc(s.exit)}</div>` : ""}
             ${s.note ? `<div class="note-box warn">⚠️ ${esc(s.note)}</div>` : ""}
           </div></div>`;
      if (s.via) return `<div class="route-link"><div class="bar"></div><div class="via">${esc(s.via)}</div></div>`;
      // 站與站之間自動補一條流動的連接線
      const next = all[i + 1];
      const line = (next && !next.via)
        ? `<div class="route-link"><div class="bar"></div><div class="via"></div></div>` : "";
      return dot + line;
    }).join("")}</div>
    ${notesHTML(b.notes)}${linksHTML(b.links)}</div>`,

  lodging: b => `<div class="card lodge"${slotAttrs(b)}>
    ${nowSlot(b)}<div><span class="ttag">🏨 住宿</span>${b.time ? `<span class="time">${esc(b.time)}</span>` : ""}${stayTag(b)}</div>
    <div class="subject">${esc(b.title)}${localSpan(b.titleLocal)}</div>
    ${b.address ? `<div class="meta">📍 ${esc(b.address)}</div>` : ""}
    ${(b.notes && b.notes.length)
      ? `<div class="info">${b.notes.map(n => `<div>${esc(n)}</div>`).join("")}</div>` : ""}
    ${secretHTML(b)}${linksHTML(b.links)}</div>`,

  options: b => `<div class="card">
    ${b.time ? `<span class="time">${esc(b.time)}</span>` : ""}${stayTag(b)}
    <div class="subject">${esc(b.title)}</div>
    ${b.place ? `<div class="meta">📍 ${esc(b.place)}${localSpan(b.placeLocal)}</div>` : ""}
    ${(b.choices||[]).map(c => `<div class="choice">
      <span class="tag">${esc(c.label)}</span>
      <div><strong>${esc(c.title)}</strong>${localSpan(c.titleLocal)}</div>
      ${c.note ? `<div class="meta">${esc(c.note)}</div>` : ""}
      ${linksHTML(c.links)}</div>`).join("")}</div>`,

  checklist: b => {
    const total = (b.groups||[]).reduce((n,g)=>n+g.items.length,0);
    const done = (b.groups||[]).reduce((n,g)=>

/* ── 現在進行到哪 ─────────────────────────────
   旅途中打開網站，最想知道的是「現在該在哪、還剩多久」。
   每 30 秒只改 class 與一行字，不重畫整頁——否則展開到一半的介紹會被收起來。 */
let firstNowPaint = true;

function markNow(){
  const n = nowAtDestination();
  const day = TRIP_DATA.days.find(d => d.id === current);
  const cards = [...document.querySelectorAll("#main .card[data-start]")];

  cards.forEach(c => {
    c.classList.remove("is-now", "is-next", "is-past");
    const l = c.querySelector(".now-line");
    if (l){ l.hidden = true; l.textContent = ""; }
  });

  /* 導覽列標出今天是哪一個分頁 */
  document.querySelectorAll(".nav-item").forEach(btn => {
    const d = TRIP_DATA.days.find(x => x.id === btn.dataset.day);
    btn.classList.toggle("is-today", !!(d && d.date === n.date));
  });

  if (!day || day.date !== n.date) return;     // 不是今天就不標任何東西

  /* 結束時間：有填停留就用它，沒填就接到下一個項目的開始時間，
     最後一項沒得接就給 2 小時。否則住宿這種沒填停留的會立刻變「已結束」。 */
  const ends = cards.map((c, i) => {
    const s = +c.dataset.start, stay = +(c.dataset.stay || 0);
    let e = stay > 0 ? s + stay : (cards[i + 1] ? +cards[i + 1].dataset.start : s + 120);
    return e > s ? e : s + 60;
  });

  let cur = null, next = null;
  cards.forEach((c, i) => {
    const s = +c.dataset.start;
    if (n.minutes >= ends[i]) c.classList.add("is-past");
    else if (n.minutes >= s)  { if (!cur) cur = { card: c, end: ends[i] }; }
    else if (!next)           next = { card: c, start: s };
  });

  const show = (card, cls, text) => {
    card.classList.add(cls);
    const l = card.querySelector(".now-line");
    if (l){ l.textContent = text; l.hidden = false; }
  };
  if (cur)       show(cur.card, "is-now",  `現在 · 還有 ${fmtMin(cur.end - n.minutes)}（預計 ${toHHMM(cur.end)} 離開）`);
  else if (next) show(next.card, "is-next", `接下來 · ${fmtMin(next.start - n.minutes)}後開始（${toHHMM(next.start)}）`);

  /* 開啟網站時捲到目前位置。只做第一次，之後自己切分頁就不要再被拉走。 */
  if (firstNowPaint){
    firstNowPaint = false;
    const target = (cur || next || {}).card;
    if (target) target.scrollIntoView({
      block: "center",
      behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"
    });
  }
}

function buildNav(){
  /* 分頁上帶日期與星期：排行程時常要確認「這天是幾號、禮拜幾」，
     不然每切一天都要看一次標題。放第二行，寬度才不會爆掉。
     沒有日期的分頁（行前、記帳、資訊）不顯示這一行。 */
  const sub = d => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d.date || ""));
    if (!m) return "";
    const wk = WEEK[new Date(d.date + "T00:00:00Z").getUTCDay()];
    return `<span class="nav-sub">${Number(m[2])}/${Number(m[3])} ${wk}</span>`;
  };
  document.getElementById("nav").innerHTML = TRIP_DATA.days.map(d =>
    `<button class="nav-item" role="tab" data-day="${esc(d.id)}" aria-selected="false">` +
      `<span class="nav-main">${esc(d.nav)}</span>${sub(d)}</button>`
  ).join("");
}

async function fetchWeather(){
  const p = M.place;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`
    + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=${encodeURIComponent(p.timezone)}&forecast_days=16`;
  try{
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    wx = { ...j, fetchedAt: Date.now() };
    LS.set(WXKEY, JSON.stringify(wx));
  }catch(e){
    console.warn("天氣抓取失敗，使用快取：", e.message);
  }
  paintNow(); paintForecast();
}

/* 目的地當地時間；沒有時區資料就不顯示 */
function localTime(){
  const tz = M.place && M.place.timezone;
  if (!tz || tz === "auto") return "";
  try{
    return "當地 " + new Intl.DateTimeFormat("zh-TW", {
      timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false
    }).format(new Date());
  }catch{ return ""; }
}

/* 目的地當地的「現在」：{ date:"YYYY-MM-DD", minutes:距午夜幾分, weekday:0-6 }

   一定要用目的地時區，不能用裝置時區。台日差一小時，台灣時間 23:00 之後
   日本已經是隔天——「第 N 天」會整整差一天，而旁邊的時鐘卻顯示當地時間，
   兩個數字互相矛盾。判斷「現在進行到哪一站」更不能錯。
   沒有時區資料就退回裝置時間。 */
function nowAtDestination(){
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  const fallback = () => ({
    date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    minutes: d.getHours() * 60 + d.getMinutes(),
    weekday: d.getDay()
  });
  const tz = M.place && M.place.timezone;
  if (!tz || tz === "auto") return fallback();
  try{
    /* hourCycle:"h23" 不能省——hour12:false 在部分瀏覽器午夜會給出「24」 */
    const p = new Intl.DateTimeFormat("en-CA", {
      timeZone: tz, year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", hourCycle:"h23"
    }).formatToParts(d).reduce((o, x) => (o[x.type] = x.value, o), {});
    const date = `${p.year}-${p.month}-${p.day}`;
    return {
      date,
      minutes: Number(p.hour) * 60 + Number(p.minute),
      weekday: new Date(date + "T00:00:00Z").getUTCDay()   // 由日期字串推，避開語系差異
    };
  }catch{ return fallback(); }
}

function paintNow(){
  const el = document.getElementById("wx-now");
  const stamp = document.getElementById("wx-stamp");
  const now = new Date();
  const WK = ["日","一","二","三","四","五","六"];
  /* 日期一律以目的地當地時間為準。旁邊顯示的就是當地時鐘，若這裡用裝置
     時區，台灣半夜時兩個數字會對不起來（日本已跨日，天數卻還沒加）。 */
  const nd = nowAtDestination();
  const utcDay = s => Date.parse(s + "T00:00:00Z");   // 一律當 UTC 解讀，相減才是整數天

  /* 今天是第幾天，或距離出發還有幾天 */
  const t0 = utcDay(M.startDate);
  const t1 = utcDay(M.endDate || M.startDate);
  const tn = utcDay(nd.date);
  let tag = "";
  if (!isNaN(t0) && !isNaN(tn)){
    if (tn < t0)      tag = `出發倒數 ${Math.round((t0 - tn) / 86400000)} 天`;
    else if (tn > t1) tag = "行程已結束";
    else              tag = `第 ${Math.round((tn - t0) / 86400000) + 1} 天`;
  }
  const [, mm, dd] = nd.date.split("-");
  const topHTML = `<div class="wx-top">
      <div class="wx-date">${Number(mm)}/${Number(dd)}<span>週${WK[nd.weekday]}${tag ? " · " + tag : ""}</span></div>
      <div class="wx-time">${esc(localTime())}</div>
    </div>`;

  if (!wx || !wx.current){
    el.innerHTML = topHTML + `<div class="wx-main"><div class="wx-emoji">🌐</div>
      <div><div class="wx-desc">尚無天氣資料</div></div></div>`;
    stamp.textContent = "連上網路後會自動更新";
    return;
  }
  const c = wx.current, [emoji, desc] = wmo(c.weather_code);
  const d = wx.daily || {};
  /* 「今日」要查的是目的地的日期。Open-Meteo 回的 daily.time 也是當地日期，
     用裝置日期比對，跨時區時會對到前一天的預報。 */
  const key = nd.date;
  const i = d.time ? d.time.indexOf(key) : -1;
  const hi = i >= 0 ? Math.round(d.temperature_2m_max[i]) : null;
  const lo = i >= 0 ? Math.round(d.temperature_2m_min[i]) : null;
  const rain = i >= 0 ? d.precipitation_probability_max[i] : null;

  el.innerHTML = topHTML + `
    <div class="wx-main">
      <div class="wx-emoji">${emoji}</div>
      <div>
        <div class="wx-temp">${Math.round(c.temperature_2m)}°</div>
        <div class="wx-desc">${esc(desc)}</div>
      </div>
      ${hi !== null ? `<div class="wx-hl">
        <div class="cap">今日</div><div class="hi">${hi}°</div><div class="lo">${lo}°</div></div>` : ""}
    </div>
    <div class="wx-grid">
      <div>體感<b>${Math.round(c.apparent_temperature)}°</b></div>
      <div>濕度<b>${c.relative_humidity_2m}%</b></div>
      <div>降雨<b>${rain ?? "—"}%</b></div>
    </div>`;

  const age = Date.now() - wx.fetchedAt;
  stamp.textContent = age < 6e5 ? "" :
    `最後更新：${new Date(wx.fetchedAt).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`;
}

function paintForecast(){
  const strip = document.getElementById("wx-strip");
  if (!strip) return;
  if (!wx || !wx.daily){
    strip.innerHTML = `<div class="note-box">尚無預報資料，連上網路後會自動更新。</div>`;
    return;
  }
  const d = wx.daily;
  const from = M.startDate, to = M.endDate || M.startDate;
  const idx = d.time.map((t, i) => i).filter(i => d.time[i] >= from && d.time[i] <= to);

  if (!idx.length){
    const gap = Math.round((Date.parse(from + "T00:00:00Z") - Date.now()) / 86400000);
    strip.innerHTML = `<div class="note-box">${
      gap > 0
        ? `距離出發還有 ${gap} 天。氣象預報只提供未來 16 天，接近出發日就會自動出現。`
        : "行程期間已過，沒有可顯示的預報。"
    }</div>`;
    return;
  }
  strip.innerHTML = idx.map(i => {
    const [e] = wmo(d.weather_code[i]);
    const dt = new Date(d.time[i] + "T00:00:00Z");
    const wd = ["日","一","二","三","四","五","六"][dt.getUTCDay()];
    return `<div class="wx-day">
      <div>${dt.getUTCMonth()+1}/${dt.getUTCDate()} 週${wd}</div>
      <div class="e">${e}</div>
      <div class="hi">${Math.round(d.temperature_2m_max[i])}°</div>
      <div class="lo">${Math.round(d.temperature_2m_min[i])}°</div>
      <div class="lo">${d.precipitation_probability_max[i] ?? "—"}%</div></div>`;
  }).join("");
}

/* 一筆花費的每人分攤，整數。除不盡的餘數一人多攤 1 元，攤完為止，
   所以加總一定等於原金額。

   直接寫 e.home / e.split.length 會留下小數，各處再各自四捨五入就湊不
   回來——1000 三人均分，畫面會顯示「A 應收 667」但「B、C 各應付 333」，
   差 1 元。筆數越多誤差越明顯。

   settle() 與兩個 CSV 匯出都走這個函式，畫面和匯出才不會各算各的。 */
function shares(e){
  const out = {};
  const n = e.split.length;
  if (!n) return out;                       // 舊資料可能沒有分攤對象
  const total = Math.round(e.home);
  const base = Math.floor(total / n);
  const rem  = total - base * n;            // 0 ≤ rem < n
  e.split.forEach((m, i) => { out[m] = base + (i < rem ? 1 : 0); });
  return out;
}

function settle(){
  const net = Object.fromEntries(M.members.map(m=>[m,0]));
  for (const e of state.expenses){
    if (net[e.payer] !== undefined) net[e.payer] += Math.round(e.home);
    const sh = shares(e);
    for (const m in sh) if (net[m] !== undefined) net[m] -= sh[m];
  }
  const cred = Object.entries(net).filter(([,v])=>v > 0.5).map(([m,v])=>({m,v})).sort((a,b)=>b.v-a.v);
  const debt = Object.entries(net).filter(([,v])=>v < -0.5).map(([m,v])=>({m,v:-v})).sort((a,b)=>b.v-a.v);
  const tx = [];
  let i=0, j=0;
  while (i < debt.length && j < cred.length){
    const amt = Math.min(debt[i].v, cred[j].v);
    tx.push({ from:debt[i].m, to:cred[j].m, amt });
    debt[i].v -= amt; cred[j].v -= amt;
    if (debt[i].v < 0.5) i++;
    if (cred[j].v < 0.5) j++;
  }
  return { net, tx };
}

function settleHTML(){
  if (!state.expenses.length) return `<div class="meta">還沒有紀錄。</div>`;
  const { net, tx } = settle();
  return M.members.map(m => `<div class="settle"><span>${esc(m)}</span>
      <span>${net[m] >= 0 ? "應收" : "應付"} <b>${esc(M.money.home)} ${fmt(Math.abs(net[m]))}</b></span></div>`).join("")
    + (tx.length ? `<div class="note-box">${tx.map(t =>
        `${esc(t.from)} → ${esc(t.to)}　<strong>${esc(M.money.home)} ${fmt(t.amt)}</strong>`).join("<br>")}</div>`
      : `<div class="note-box">已經結清。</div>`);
}

/* ── 匯出 CSV ── */
const csvCell = v => {
  const s = String(v ?? "");
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
};
const dateTag = () => new Date().toISOString().slice(0,10).replace(/-/g,"");

function downloadCSV(name, rows){
  // \uFEFF (BOM) 讓 Excel 正確辨識 UTF-8，否則中文會變亂碼
  const text = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([text], { type:"text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportDetail(){
  if (!state.expenses.length){ alert("還沒有花費紀錄"); return; }
  const day  = id => TRIP_DATA.days.find(d => d.id === id) || {};
  const rows = [[
    "日期","行程","項目","分類","付款人","分攤對象","分攤人數",
    M.money.local, M.money.home, `每人分攤(${M.money.home})`,"記錄時間","記錄者"
  ]];
  for (const e of [...state.expenses].sort((a,b)=>a.createdAt-b.createdAt)){
    const d = day(e.day);
    rows.push([
      d.date || "", d.nav || e.day, e.item, e.cat, e.payer,
      e.split.join("、"), e.split.length,
      /* 分攤不一定每人相同（餘數會多攤 1 元），所以逐人列出，
         順序與「分攤對象」欄一致，加起來剛好等於金額。 */
      e.local || "", e.home, e.split.map(m => shares(e)[m]).join("、"),
      new Date(e.createdAt).toLocaleString("sv-SE"), e.createdBy || ""
    ]);
  }
  downloadCSV(`${M.tripId}_花費明細_${dateTag()}.csv`, rows);
}

function exportSettle(){
  if (!state.expenses.length){ alert("還沒有花費紀錄"); return; }
  const { net, tx } = settle();
  const paid = Object.fromEntries(M.members.map(m=>[m,0]));
  const owe  = Object.fromEntries(M.members.map(m=>[m,0]));
  const byCat = {};
  for (const e of state.expenses){
    const total = Math.round(e.home);
    if (paid[e.payer] !== undefined) paid[e.payer] += total;
    const sh = shares(e);
    for (const m in sh) if (owe[m] !== undefined) owe[m] += sh[m];
    byCat[e.cat] = (byCat[e.cat] || 0) + total;
  }
  const rows = [["成員","代墊總額","應分攤","淨額","狀態"]];
  for (const m of M.members)
    rows.push([m, Math.round(paid[m]), Math.round(owe[m]),
               Math.round(Math.abs(net[m])), net[m] >= 0 ? "應收" : "應付"]);
  rows.push([], ["結清建議","付款人","收款人",`金額(${M.money.home})`]);
  tx.forEach((t,i) => rows.push([i+1, t.from, t.to, Math.round(t.amt)]));
  rows.push([], ["分類統計","金額"]);
  for (const [c,v] of Object.entries(byCat).sort((a,b)=>b[1]-a[1])) rows.push([c, Math.round(v)]);
  rows.push([], ["總計", Math.round(state.expenses.reduce((s,e)=>s+e.home,0))]);
  downloadCSV(`${M.tripId}_結清摘要_${dateTag()}.csv`, rows);
}

/* ── 卡片上的私人資料 ──────────────────────────
   密文在 TRIP_DATA.vault（tools/encrypt-vault.mjs 產生：PBKDF2-SHA256 推導金鑰、AES-GCM 加密），
   卡片只帶一個 secret 鍵。鎖著時那一格是一顆按鈕，解開後每張帶鍵的卡片換成自己那一段。
   解密用瀏覽器內建的 Web Crypto，不靠網路，離線也解得開。解開的內容只放在記憶體；
   勾「記住」的話密語存在這台裝置，下次打開自動解。 */
let vaultData = null;
const VAULT_LS = `${KEY}:vault`;

/* 大小寫、空白、連字號都不計較——手機鍵盤會自動把第一個字母改大寫。
   跟 tools/encrypt-vault.mjs 的規則必須一模一樣，否則加密與解密對不上。 */
const normPass = p => String(p ?? "").normalize("NFKC").toLowerCase()
  .replace(/[\s\-\u2010-\u2015]/g, "");
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function openVault(pass){
  const v = TRIP_DATA.vault;
  const subtle = globalThis.crypto && crypto.subtle;
  if (!subtle) throw Object.assign(new Error("這個網址不是 HTTPS，瀏覽器不允許解密"), { fatal:true });
  const base = await subtle.importKey("raw", new TextEncoder().encode(normPass(pass)),
                                      "PBKDF2", false, ["deriveKey"]);
  const key = await subtle.deriveKey(
    { name:"PBKDF2", hash:"SHA-256", salt:unb64(v.salt), iterations:v.iterations },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await subtle.decrypt({ name:"AES-GCM", iv:unb64(v.iv) }, key, unb64(v.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

const secretItemHTML = it => {
  if (it.note) return `<div class="secret-note">${esc(it.note)}</div>`;
  if (/^https?:\/\//i.test(String(it.url || "")))
    return `<a class="btn btn-theme" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.label || "開啟")}</a>`;
  return `<div class="secret-row"><span class="secret-label">${esc(it.label)}</span>
    <span class="secret-val">${esc(it.value)}</span></div>`;
};

function secretHTML(b){
  if (!b.secret || !TRIP_DATA.vault) return "";
  const key = esc(b.secret), hint = esc(b.secretHint || "私人資料");
  const sec = vaultData && vaultData.sections && vaultData.sections[b.secret];
  return sec
    ? `<div class="secret" data-secret="${key}" data-hint="${hint}">
        ${(sec.items || []).map(secretItemHTML).join("")}
        <button class="secret-lock" data-vault-lock type="button">上鎖</button></div>`
    : `<div class="secret is-locked" data-secret="${key}" data-hint="${hint}">
        <button class="secret-ask" data-vault-ask type="button">🔒 顯示${hint}</button></div>`;
}

/* 只換掉卡片上的私人資料那一格，不重畫整頁——整頁重畫會捲回頂端，展開的介紹也會收起來 */
function repaintSecrets(){
  for (const el of document.querySelectorAll("#main .secret[data-secret]"))
    el.outerHTML = secretHTML({ secret: el.dataset.secret, secretHint: el.dataset.hint });
}

/* 按下「🔒 顯示…」：就在這張卡片裡展開輸入框 */
function askVault(btn){
  const box = btn.closest(".secret");
  box.classList.remove("is-locked");
  box.innerHTML = `<form class="vault-form" autocomplete="off">
      <input class="input vault-pass" type="password" name="pass" placeholder="通關密語"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="btn btn-theme" type="submit">解鎖</button>
      <label class="vault-remember"><input type="checkbox" name="remember" checked>
        <span>在這台裝置記住，下次自動解開</span></label>
      <div class="vault-msg" aria-live="polite"></div>
    </form>`;
  box.querySelector(".vault-pass").focus();
}

/* 渲染完才跑：有記住密語、還沒解開的，在這裡自動解 */
async function paintVaults(){
  const pass = LS.get(VAULT_LS);
  if (vaultData || !pass || !TRIP_DATA.vault || !document.querySelector("#main .secret")) return;
  try {
    vaultData = await openVault(pass);
    repaintSecrets();
  } catch (e) {
    if (!e.fatal) LS.del(VAULT_LS);     // 密語換過了：忘掉舊的，下次按按鈕重新輸入
  }
}

async function unlockVault(form){
  const pass = form.elements.pass.value;
  const msg  = form.querySelector(".vault-msg");
  const btn  = form.querySelector("button[type=submit]");
  const say  = (t, err) => { msg.textContent = t; msg.classList.toggle("is-err", !!err); };
  if (!normPass(pass)) return say("請輸入通關密語", true);
  btn.disabled = true;
  say("解鎖中…");
  try {
    vaultData = await openVault(pass);
    if (form.elements.remember.checked) LS.set(VAULT_LS, pass);
    else LS.del(VAULT_LS);
    repaintSecrets();
  } catch (e) {
    btn.disabled = false;
    say(e.fatal ? e.message : "通關密語不對", true);
    form.elements.pass.select();
  }
}

function lockVault(){
  vaultData = null;
  LS.del(VAULT_LS);
  repaintSecrets();
}

/* 購物清單的增刪。會改變項目數量，所以要重畫，但只重畫當前分頁。 */
document.getElementById("main").addEventListener("click", e => {
  const s = shopBag();
  const forget = id => {
    /* 種子項目記進 removed（重新產生網站後才不會跑回來），
       自己加的直接從 added 拿掉。 */
    const i = s.added.findIndex(a => a.id === id);
    if (i >= 0) s.added.splice(i, 1);
    else if (!s.removed.includes(id)) s.removed.push(id);
    delete s.edits[id];
  };
  const del = e.target.closest("[data-del]");
  if (del){ forget(del.dataset.del); persist(); renderDay(current); return; }

  const dg = e.target.closest("[data-delgroup]");
  if (dg){
    const box = dg.closest(".shop-g");
    for (const el of box.querySelectorAll("[data-id]")) forget(el.dataset.id);
    s.groups = s.groups.filter(g => g !== dg.dataset.delgroup);
    persist(); renderDay(current); return;
  }
});

    for (const k of Object.keys(state.cards)) delete state.cards[k].hidden;
    persist(); renderDay(current); return;

  if (e.target.id === "e-add")  return addExpense();
  if (e.target.id === "e-csv")  return exportDetail();
  if (e.target.id === "e-csv2") return exportSettle();

  const local = Number(document.getElementById("e-local").value) || 0;

  if (!home && local && M.money.rate) home = Math.round(local * M.money.rate);
  const split = [...document.querySelectorAll('#e-split input:checked')].map(x=>x.value);
  if (!item){ alert("請填寫項目"); return; }
  if (!home){ alert("請填寫金額"); return; }
  if (!split.length){ alert("請至少選一位分攤對象"); return; }
  state.expenses.push({
    id: crypto.randomUUID(),
    day: document.getElementById("e-day").value,
    payer: document.querySelector('#e-payer input:checked').value,
    item, local, home,
    cat: document.getElementById("e-cat").value,
    split, createdAt: Date.now(), createdBy: state.me || ""
  });
  persist(); push({ type:"expenses" }); renderDay(current);
}

/* ── 離線優先同步 ── */
let db = null, uid = null;
function push(change){
  state.queue.push({ ...change, at: Date.now() });
  persist();
  flush();
}
async function flush(){
  if (!db || !navigator.onLine){
    const n = state.queue.length;
    setSync(db ? "offline" : "local", db ? (n ? `離線中（${n} 筆待傳）` : "離線中") : "單機模式");
    return;
  }
  if (!state.queue.length){ setSync("ok","已同步"); return; }
  try{
    const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    /* 只同步記帳。打包、購物等清單刻意留在各自的裝置上。 */
    await setDoc(doc(db, "trips", M.tripId, "shared", "state"), {
      expenses: state.expenses, updatedAt: Date.now()
    });
    state.queue = []; persist(); setSync("ok","已同步");
  }catch(e){
    console.error("同步失敗：", e);
    setSync("error", "同步失敗");
  }
}

async function initFirebase(){
  if (!FIREBASE_CONFIG){ setSync("local","單機模式"); return; }
  if (!navigator.onLine){
    setSync("offline","離線中");
    window.addEventListener("online", initFirebase, { once:true });
    return;
  }
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
    const { getFirestore, doc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const app = initializeApp(FIREBASE_CONFIG);
    const cred = await signInAnonymously(getAuth(app));
    uid = cred.user.uid;
    db = getFirestore(app);
    /* 成員名稱不在這裡問。prompt() 若不被支援會丟錯，整個初始化就掉進
       catch 顯示「雲端連線失敗」——即使登入與 Firestore 其實都成功了；
       使用者按取消也沒有第二次機會。改用記帳頁的「我是誰」選擇器。 */
    onSnapshot(doc(db, "trips", M.tripId, "shared", "state"), snap => {
      const d = snap.data();
      if (!d || state.queue.length) return;   // 本地有未傳資料時不覆蓋
      /* 刻意不碰 state.checks / shopping / cards：這些清單都是各自的，
         遠端殘留的舊值要忽略。 */
      state.expenses = d.expenses || [];
      persist(); renderDay(current);
    });
    flush();
  }catch(e){
    console.error("Firebase 初始化失敗：", e);
    setSync("error","雲端連線失敗");
  }
}

window.addEventListener("online", flush);
window.addEventListener("offline", () => setSync(db ? "offline" : "local", db ? "離線中" : "單機模式"));

/* ── PWA：註冊 Service Worker ── */
function toast(msg, ms = 3200){
  let t = document.getElementById("toast");
  if (!t){
    t = document.createElement("div");
    t.id = "toast"; t.className = "toast"; t.setAttribute("role","status");
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), ms);
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js")
    .catch(err => console.warn("Service Worker 註冊失敗：", err));
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController) toast("行程已更新，重新開啟即可看到最新版");
  });
}

/* 主題為 auto 或留空時，依出發月份與半球推導。
   產生器在輸出時就會算好，所以這裡通常用不到——但手動編輯 TRIP_DATA
   的人照規範可以填 "auto"，少了這段就會變成 data-theme="auto"，對不上
   任何 CSS 規則，整頁沒有主題。邏輯與 builder/assets/parse.js 的
   autoTheme() 相同：用字串取月份，不經過 Date，避開時區位移。 */
function resolveTheme(meta){
  const t = (meta.theme || "").trim();
  if (t && t !== "auto") return t;
  if (!meta.startDate) return "none";
  const m = Number(String(meta.startDate).slice(5, 7)) || 1;
  const lat = meta.place && meta.place.lat;
  const shift = (lat != null && lat < 0) ? ((m + 5) % 12) + 1 : m;   // 南半球季節對調
  if (shift === 12 || shift <= 2) return "snow";
  if (shift <= 5) return "sakura";
  if (shift <= 8) return "ocean";
  return "maple";
}

/* ── 啟動 ── */
document.documentElement.dataset.theme = resolveTheme(M);
document.title = M.title;
document.getElementById("app-title").textContent = M.title;
document.getElementById("app-sub").textContent = M.subtitle || "";
/* 編輯入口：有填試算表網址才出現 */
(function editBar(){
  const bar = document.getElementById("edit-bar");
  const out = [];
  if (M.sheetUrl)
    out.push(`<a href="${esc(M.sheetUrl)}" target="_blank" rel="noopener">✏️ 編輯行程</a>`);
  if (M.builderUrl){
    const u = M.builderUrl + (M.sheetUrl ? (M.builderUrl.includes("?") ? "&" : "?") +
              "sheet=" + encodeURIComponent(M.sheetUrl) : "");
    out.push(`<a class="go" href="${esc(u)}" target="_blank" rel="noopener">🔄 重新產生網站</a>`);
  }
  bar.innerHTML = out.join("");
})();

/* 勾選 key 從「陣列索引」改成「項目文字」的一次性轉換。
   不轉的話，升級後所有已經打好的勾會憑空消失。必須在第一次渲染前跑完。
   旗標存在 checks 裡，不會跟真正的 key 衝突（真 key 一定含兩個冒號）。 */
(function migrateCheckKeys(){
  if (state.checks.__keys_v2) return;
  const out = { __keys_v2: true };
  for (const day of TRIP_DATA.days || [])
    for (const b of day.blocks || []){
      if (b.type !== "checklist" || b.shared) continue;   // 共用清單是新的，沒有舊資料
      for (const g of b.groups || [])
        (g.items || []).forEach((it, i) => {
          if (state.checks[`${b.key}:${g.name}:${i}`]) out[chkKey(b, g, it)] = true;
        });
    }
  state.checks = out;
  persist();
})();

buildNav();
/* 開啟時直接跳到今天。旅途中每次都要自己點到正確的分頁很煩；
   不在行程期間（還沒出發、或已結束）就照舊顯示第一個分頁。 */
renderDay((TRIP_DATA.days.find(d => d.date === nowAtDestination().date) || TRIP_DATA.days[0]).id);

/* 每 30 秒更新一次；從背景切回來時也立刻更新，
   否則放了幾小時再打開會停在舊的標記上。 */
/* 優惠券圖片要先抓進快取：在店裡結帳時不一定有訊號，而那正是要打開它的時候。
   放在自己的快取名稱（trip-img），這樣換優惠券就不必改 sw.js、也不用升 VERSION。
   sw.js 的 cacheFirst 用的是 caches.match()，會搜尋所有快取，所以找得到。 */
(async function cacheCouponImages(){
  if (!("caches" in window)) return;
  const urls = [];
  for (const day of TRIP_DATA.days || [])
    for (const b of day.blocks || [])
      if (b.type === "shopping")
        for (const g of b.groups || [])
          for (const it of g.items || [])
            if (it && it.img) urls.push(it.img);
  if (!urls.length) return;
  try{
    const c = await caches.open("trip-img");
    /* 一張一張加，有一張失敗不要讓其他的也沒快取到（addAll 是全有或全無） */
    await Promise.all(urls.map(u => c.match(u).then(hit => hit || c.add(u)).catch(() => {})));
  }catch{ /* 快取滿了或被拒絕就算了，線上仍然看得到 */ }
})();

setInterval(markNow, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) markNow(); });
paintNow();
fetchWeather();
initFirebase();
</script>
